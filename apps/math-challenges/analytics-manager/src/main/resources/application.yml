spring:
  application:
    name: analytics-manager
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
      retry:
        enabled: true
        max-attempts: 10
        initial-interval: 1000
        multiplier: 4
        max-interval: 3600000
      default-requeue-rejected: false
  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USER}
      password: ${NEO4J_PASSWORD}
    database: ${NEO4J_DATABASE:neo4j}

server:
  port: ${SERVICE_PORT:8080}
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
      base-path: /
  endpoint:
    health:
      show-details: when-authorized
  info:
    build:
      enabled: true

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n'

app:
  auth:
    secret: ${AUTH_SECRET:}
    expiration-time: "PT6H"
  messaging:
    dead-letter:
      exchange: dead-letter-exchange
      binding-key: dead-letter
      queue: dead-letter-queue
    user:
      exchange: user-exchange
      binding-key: user.*
      queue: user-queue
    challenge:
      exchange: challenge-exchange
      binding-key: challenge-solved.*
      queue: challenges-queue