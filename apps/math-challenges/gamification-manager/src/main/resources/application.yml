spring:
  application:
    name: gamification-manager
  datasource:
    url: ${DATASOURCE_URL}
    username: ${POSTGRES_GAMIFICATION_MANAGER_USER}
    password: ${POSTGRES_GAMIFICATION_MANAGER_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  jpa:
    show-sql: true
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    username: ${REDIS_USER}
    password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    template:
      observation-enabled: true
    publisher-confirm-type: CORRELATED
    listener:
      simple:
        observation-enabled: true
      retry:
        enabled: true
        max-attempts: 10
        initial-interval: 1000
        multiplier: 4
        max-interval: 3600000
      default-requeue-rejected: false

server:
  port: ${SERVICE_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
      base-path: /
  endpoint:
    health:
      show-details: when-authorized
  info:
    build:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n'

app:
  auth:
    secret: ${AUTH_SECRET}
    expiration-time: "PT6H"
  difficulty-levels:
    - level: easy
      digits: 1
      score: 10
    - level: medium
      digits: 2
      score: 20
    - level: hard
      digits: 3
      score: 30
    - level: expert
      digits: 4
      score: 40
  badges:
    - badge-type: FIRST_WON
    - badge-type: BRONZE
      score_threshold: 100
    - badge-type: SILVER
      score_threshold: 250
    - badge-type: GOLD
      score_threshold: 500
    - badge-type: LUCKY_NUMBER
      lucky_number: 42
  alias-cache:
    key: user_aliases
    duration: PT1H
  leaderboard-cache:
    key: leaderboard
    size: 10
  clients:
    user-manager:
      load-balanced: false
      users-endpoint: http://${USER_MANAGER_HOST}:${USER_MANAGER_PORT}/users
      retry:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff: 1.5
  messaging:
    dead-letter:
      exchange: dead-letter-exchange
      binding-key: dead-letter
      queue: dead-letter-queue
    challenge:
      exchange: challenge-exchange
      challenge-correct-binding-key: challenge-solved.correct
      queue: challenge-solved.correct.queue