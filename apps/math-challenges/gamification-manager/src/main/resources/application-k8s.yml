management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://tempo:9411/api/v2/spans
spring:
  cloud:
    consul:
      enabled: false # Disable Consul entirely
      discovery:
        enabled: false
    loadbalancer:
      enabled: false # Disable LoadBalancer so gateway routes use plain HTTP with k8s DNS directly

app:
  clients:
    user-manager:
      load-balanced: false
