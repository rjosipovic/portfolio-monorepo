spring:
  application:
    name: notification-manager
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  messaging:
    dead-letter:
      exchange: dead-letter-exchange
      binding-key: dead-letter
      queue: dead-letter-queue
    notifications:
      exchange: notifications-exchange
      notifications-binding-key: notifications.auth
      queue: auth-notifications-queue
  email:
    default-from: ${DEFAULT_MAIL_FROM:no-reply@challenges.com}
    default-to: ${DEFAULT_MAIL_TO}