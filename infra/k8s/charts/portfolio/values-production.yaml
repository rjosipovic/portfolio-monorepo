# values-production.yaml
# Production overrides for k3s on Hetzner
# Usage: helm upgrade --install portfolio . -f values.yaml -f secrets.yaml -f values-production.yaml --namespace portfolio

global:
  imageTag: "1.0.1"

ingress:
  className: "traefik"

apps:
  portfolioWeb:
    ingress:
      host: "roman-josipovic.from.hr"
    mathChallengesUrl: "https://math.roman-josipovic.from.hr"

  frontend:
    ingress:
      host: "math.roman-josipovic.from.hr"
    apiProtocol: "https"

  apiGateway:
    ingress:
      host: "api.roman-josipovic.from.hr"
    allowedOrigins: "https://math.roman-josipovic.from.hr"

tls:
  enabled: true
  clusterIssuer: "letsencrypt-prod"
  secretName: "portfolio-wildcard-tls"