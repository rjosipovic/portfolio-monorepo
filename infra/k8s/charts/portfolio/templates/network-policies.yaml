# Default deny-all ingress for the whole namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# api-gateway: accepts traffic from ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-netpol
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
  egress:
    - ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: user-manager
        - podSelector:
            matchLabels:
              app: challenge-manager
        - podSelector:
            matchLabels:
              app: gamification-manager
        - podSelector:
            matchLabels:
              app: notification-manager
        - podSelector:
            matchLabels:
              app: analytics-manager
      ports:
        - port: 8080

---
# user-manager: accepts from api-gateway and gamification-manager
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-manager-netpol
spec:
  podSelector:
    matchLabels:
      app: user-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: gamification-manager
      ports:
        - port: 8080
    - ports:
        - port: 9090  # management/prometheus scraping
  egress:
    - ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672

---
# challenge-manager: accepts from api-gateway only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: challenge-manager-netpol
spec:
  podSelector:
    matchLabels:
      app: challenge-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8080
    - ports:
        - port: 9090
  egress:
    - ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672

---
# gamification-manager: accepts from api-gateway only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gamification-manager-netpol
spec:
  podSelector:
    matchLabels:
      app: gamification-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8080
    - ports:
        - port: 9090
  egress:
    - ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672
    - to:
        - podSelector:
            matchLabels:
              app: user-manager
      ports:
        - port: 8080

---
# analytics-manager: accepts from api-gateway only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-manager-netpol
spec:
  podSelector:
    matchLabels:
      app: analytics-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8080
    - ports:
        - port: 9090
  egress:
    - ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672
    - to:
        - podSelector:
            matchLabels:
              app: neo4j-analytics
      ports:
        - port: 7687

---
# notification-manager: accepts from api-gateway only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-manager-netpol
spec:
  podSelector:
    matchLabels:
      app: notification-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8080
    - ports:
        - port: 9090
  egress:
    - ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672
    # SMTP egress — must exit the cluster
    - ports:
        - port: 587
---
# frontend: accepts traffic from ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-netpol
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 80
  egress:
    - ports:
        - port: 53
          protocol: UDP

---
# postgres: accepts from app services and migrations job
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-netpol
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: user-manager
        - podSelector:
            matchLabels:
              app: challenge-manager
        - podSelector:
            matchLabels:
              app: gamification-manager
        - podSelector:
            matchLabels:
              app: postgres-migrations
      ports:
        - port: 5432

---
# redis: accepts from user-manager and challenge-manager
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-netpol
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: user-manager
        - podSelector:
            matchLabels:
              app: challenge-manager
      ports:
        - port: 6379

---
# rabbitmq: accepts from all app services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-netpol
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: user-manager
        - podSelector:
            matchLabels:
              app: challenge-manager
        - podSelector:
            matchLabels:
              app: gamification-manager
        - podSelector:
            matchLabels:
              app: analytics-manager
        - podSelector:
            matchLabels:
              app: notification-manager
      ports:
        - port: 5672

---
# neo4j-analytics: accepts from analytics-manager only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neo4j-analytics-netpol
spec:
  podSelector:
    matchLabels:
      app: neo4j-analytics
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: analytics-manager
      ports:
        - port: 7687
