{{- if .Values.networkPolicies.enabled }}
# Default deny-all ingress for the whole namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# api-gateway: accepts traffic from ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-netpol
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
        - port: 9090  # management/prometheus scraping
  egress:
    - ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: user-manager
        - podSelector:
            matchLabels:
              app: challenge-manager
        - podSelector:
            matchLabels:
              app: gamification-manager
        - podSelector:
            matchLabels:
              app: notification-manager
        - podSelector:
            matchLabels:
              app: analytics-manager
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: tempo
      ports:
        - port: 9411

---
# user-manager: accepts from api-gateway and gamification-manager
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-manager-netpol
spec:
  podSelector:
    matchLabels:
      app: user-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: gamification-manager
      ports:
        - port: 8080
    - ports:
        - port: 9090  # management/prometheus scraping
  egress:
    - ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: tempo
      ports:
        - port: 9411
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672

---
# challenge-manager: accepts from api-gateway only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: challenge-manager-netpol
spec:
  podSelector:
    matchLabels:
      app: challenge-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8080
    - ports:
        - port: 9090
  egress:
    - ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: tempo
      ports:
        - port: 9411
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672

---
# gamification-manager: accepts from api-gateway only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gamification-manager-netpol
spec:
  podSelector:
    matchLabels:
      app: gamification-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8080
    - ports:
        - port: 9090
  egress:
    - ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672
    - to:
        - podSelector:
            matchLabels:
              app: user-manager
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: tempo
      ports:
        - port: 9411
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379

---
# analytics-manager: accepts from api-gateway only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-manager-netpol
spec:
  podSelector:
    matchLabels:
      app: analytics-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8080
    - ports:
        - port: 9090
  egress:
    - ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672
    - to:
        - podSelector:
            matchLabels:
              app: tempo
      ports:
        - port: 9411
    - to:
