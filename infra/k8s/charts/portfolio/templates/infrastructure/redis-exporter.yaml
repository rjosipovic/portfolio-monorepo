{{- if .Values.observability.redisExporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: {{ .Values.namespaces.observability }}
  labels:
    app: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      initContainers:
        {{- include "portfolio.wait-for" (list (printf "%s:6379" .Values.infrastructure.redis.host)) | nindent 8 }}
      containers:
        - name: redis-exporter
          image: {{ .Values.observability.redisExporter.image }}
          imagePullPolicy: IfNotPresent
          resources: {{- toYaml .Values.observability.redisExporter.resources | nindent 12 }}

          ports:
            - containerPort: 9121
          envFrom:
            - secretRef:
                name: redis-exporter-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9121
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9121
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: {{ .Values.namespaces.observability }}
spec:
  selector:
    app: redis-exporter
  ports:
    - port: 9121
      targetPort: 9121
  type: ClusterIP
{{- end }}