{{- if .Values.infrastructure.neo4jAnalytics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j-analytics
  labels:
    app: neo4j-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j-analytics
  template:
    metadata:
      labels:
        app: neo4j-analytics
    spec:
      enableServiceLinks: false # Prevents K8s from injecting <SERVICE>_PORT_* env vars, which Neo4j misinterprets as config settings under strict validation
      containers:
        - name: neo4j-analytics
          image: neo4j:2025.09.0
          resources: {{- toYaml .Values.infrastructure.neo4jAnalytics.resources | nindent 12 }}
          ports:
            - containerPort: 7474
            - containerPort: 7687
          envFrom:
            - secretRef:
                name: neo4j-analytics-secret
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: neo4j-analytics-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-analytics-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.infrastructure.neo4jAnalytics.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j-analytics
spec:
  selector:
    app: neo4j-analytics
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
  type: ClusterIP
{{- end }}
