{{- if .Values.infrastructure.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # redis/redis-stack runs as root by default; replacing with redis:7-alpine + standalone RedisInsight — tracked in separate card
      containers:
        - name: redis
          image: redis/redis-stack:7.2.0-v10
          resources: {{- toYaml .Values.infrastructure.redis.resources | nindent 12 }}
          ports:
            - containerPort: 6379
            - containerPort: 8001
          env:
            - name: REDIS_ARGS
              value: "--save 60 1 --appendonly yes --user $(REDIS_USER) on >$(REDIS_PASSWORD) ~* +@all"
          envFrom:
            - secretRef:
                name: redis-secret
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.infrastructure.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: ui
      port: 8001
      targetPort: 8001
  type: ClusterIP
{{- end }}
