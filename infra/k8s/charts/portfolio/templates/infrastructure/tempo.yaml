{{- if .Values.observability.tempo.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: {{ .Values.namespaces.observability }}
data:
  tempo.yml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        zipkin:
          endpoint: "0.0.0.0:9411"

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

    metrics_generator:
      registry:
        external_labels:
          source: tempo
      processor:
        service_graphs:
          dimensions: []
        span_metrics:
          dimensions: []
      storage:
        path: /var/tempo/metrics
        remote_write:
          - url: http://prometheus.observability.svc.cluster.local:9090/api/v1/write
    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics

    usage_report:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: {{ .Values.namespaces.observability }}
  labels:
    app: tempo
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: tempo
          image: {{ .Values.observability.tempo.image }}
          imagePullPolicy: IfNotPresent
          args:
            - '-config.file=/etc/tempo/tempo.yml'
          resources: {{- toYaml .Values.observability.tempo.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 3200
            - name: zipkin
              containerPort: 9411
          livenessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          persistentVolumeClaim:
            claimName: tempo-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-pvc
  namespace: {{ .Values.namespaces.observability }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.observability.tempo.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: {{ .Values.namespaces.observability }}
spec:
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: zipkin
      port: 9411
      targetPort: 9411
  type: ClusterIP
{{- end }}