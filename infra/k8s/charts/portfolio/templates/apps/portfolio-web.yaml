{{- if .Values.apps.portfolioWeb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-web
  namespace: {{ .Values.namespaces.portfolioWeb }}
  labels:
    app: portfolio-web
spec:
  replicas: {{ .Values.apps.portfolioWeb.replicas | default 1 }}
  selector:
    matchLabels:
      app: portfolio-web
  template:
    metadata:
      labels:
        app: portfolio-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: portfolio-web
          image: {{ .Values.apps.portfolioWeb.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources: {{- toYaml .Values.apps.portfolioWeb.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config-js
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: config-js
          configMap:
            name: portfolio-web-config
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-web
  namespace: {{ .Values.namespaces.portfolioWeb }}
  labels:
    app: portfolio-web
spec:
  selector:
    app: portfolio-web
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP
{{- end }}