{{- if .Values.apps.userManager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-manager
  namespace: {{ .Values.namespaces.sharedServices }}
  labels:
    app: user-manager
spec:
  replicas: {{ .Values.apps.userManager.replicas | default 1 }}
  selector:
    matchLabels:
      app: user-manager
  template:
    metadata:
      labels:
        app: user-manager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      initContainers:
        {{- include "portfolio.wait-for" (list (printf "%s:5432" .Values.infrastructure.postgres.host) (printf "%s:5672" .Values.infrastructure.rabbitmq.host) (printf "%s:6379" .Values.infrastructure.redis.host)) | nindent 8 }}
      containers:
        - name: user-manager
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ .Values.apps.userManager.image }}:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent
          resources: {{- toYaml .Values.apps.userManager.resources | nindent 12 }}
          ports:
            - name: http-api
              containerPort: {{ .Values.global.servicePort | default 8080 }}
            - name: management
              containerPort: {{ .Values.global.managementPort | default 9090 }}
          envFrom:
            - configMapRef:
                name: user-manager-config
            - secretRef:
                name: user-manager-secret
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: management
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: user-manager
  namespace: {{ .Values.namespaces.sharedServices }}
  labels:
    app: user-manager
spec:
  selector:
    app: user-manager
  ports:
    - name: http-api
      port: {{ .Values.global.servicePort | default 8080 }}
      targetPort: http-api
    - name: management
      port: {{ .Values.global.managementPort | default 9090 }}
      targetPort: management
  type: ClusterIP
{{- end }}
