{{- if .Values.apps.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Values.namespaces.sharedServices }}
  labels:
    app: api-gateway
spec:
  replicas: {{ .Values.apps.apiGateway.replicas | default 1 }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: api-gateway
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ .Values.apps.apiGateway.image }}
          imagePullPolicy: IfNotPresent
          resources: {{- toYaml .Values.apps.apiGateway.resources | nindent 12 }}
          ports:
            - name: http-api
              containerPort: {{ .Values.global.servicePort | default 8080 }}
            - name: management
              containerPort: {{ .Values.global.managementPort | default 9090 }}
          envFrom:
            - configMapRef:
                name: api-gateway-config
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: management
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.namespaces.sharedServices }}
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http-api
      port: {{ .Values.global.servicePort | default 8080 }}
      targetPort: http-api
    - name: management
      port: {{ .Values.global.managementPort | default 9090 }}
      targetPort: management
  type: ClusterIP # Change to LoadBalancer or NodePort for external access
{{- end }}
