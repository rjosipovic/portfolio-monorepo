{{- if .Values.apps.gamificationManager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamification-manager
  labels:
    app: gamification-manager
spec:
  replicas: {{ .Values.apps.gamificationManager.replicas | default 1 }}
  selector:
    matchLabels:
      app: gamification-manager
  template:
    metadata:
      labels:
        app: gamification-manager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      initContainers:
        {{- include "portfolio.wait-for" (list "postgres:5432" "rabbitmq:5672" "redis:6379") | nindent 8 }}
      containers:
        - name: gamification-manager
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ .Values.apps.gamificationManager.image }}
          imagePullPolicy: IfNotPresent
          resources: {{- toYaml .Values.apps.gamificationManager.resources | nindent 12 }}
          ports:
            - name: http-api
              containerPort: {{ .Values.global.servicePort | default 8080 }}
            - name: management
              containerPort: {{ .Values.global.managementPort | default 9090 }}
          envFrom:
            - configMapRef:
                name: gamification-manager-config
            - secretRef:
                name: gamification-manager-secret
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: management
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gamification-manager
  labels:
    app: gamification-manager
spec:
  selector:
    app: gamification-manager
  ports:
    - name: http-api
      port: {{ .Values.global.servicePort | default 8080 }}
      targetPort: http-api
    - name: management
      port: {{ .Values.global.managementPort | default 9090 }}
      targetPort: management
  type: ClusterIP
{{- end }}
