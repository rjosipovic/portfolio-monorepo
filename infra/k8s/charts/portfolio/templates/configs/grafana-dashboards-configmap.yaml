{{- if .Values.observability.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Values.namespaces.observability }}
data:
  spring-boot-dashboard.json: |
{{ .Files.Get "dashboards/spring-boot-dashboard.json" | indent 4 }}
  postgres-exporter-dashboard.json: |
{{ .Files.Get "dashboards/postgres-exporter-dashboard.json" | indent 4 }}
  rabbitmq-dashboard.json: |
{{ .Files.Get "dashboards/rabbitmq-dashboard.json" | indent 4 }}
  redis-dashboard.json: |
{{ .Files.Get "dashboards/redis-dashboard.json" | indent 4 }}
{{- end }}