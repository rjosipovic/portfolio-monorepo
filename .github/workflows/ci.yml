name: CI — Build & Push to Staging

on:
  push:
    branches: [master]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'infra/postgres-migrations/**'

env:
  DOCKER_USER: rjosipovic
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: user-manager, path: services/user-manager, image: portfolio-common-user-manager, type: maven }
          - { name: notification-manager, path: services/notification-manager, image: portfolio-common-notification-manager, type: maven }
          - { name: api-gateway, path: services/api-gateway, image: portfolio-common-api-gateway, type: maven }
          - { name: challenge-manager, path: apps/math-challenges/challenge-manager, image: portfolio-math-challenges-challenge-manager, type: maven }
          - { name: gamification-manager, path: apps/math-challenges/gamification-manager, image: portfolio-math-challenges-gamification-manager, type: maven }
          - { name: analytics-manager, path: apps/math-challenges/analytics-manager, image: portfolio-math-challenges-analytics-manager, type: maven }
          - { name: frontend, path: apps/math-challenges/fe, image: portfolio-math-challenges-frontend, type: static }
          - { name: portfolio-web, path: apps/portfolio-web, image: portfolio-web, type: static }
          - { name: postgres-migrations, path: infra/postgres-migrations, image: portfolio-postgres-migrations, type: static }
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        if: matrix.service.type == 'maven'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test
        if: matrix.service.type == 'maven'
        run: ./mvnw clean package
        working-directory: ${{ matrix.service.path }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.DOCKER_USER }}/${{ matrix.service.image }}"
          docker build -t "$IMAGE:dev-$SHORT_SHA" .
          docker push "$IMAGE:dev-$SHORT_SHA"
        working-directory: ${{ matrix.service.path }}

  update-staging-values:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update staging image tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="dev-$SHORT_SHA"
          sed -i "s/imageTag: .*/imageTag: \"$TAG\"/" infra/k8s/charts/portfolio/values-staging.yaml

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/charts/portfolio/values-staging.yaml
          git diff --cached --quiet || git commit -m "ci: update staging to dev-$(echo ${{ github.sha }} | cut -c1-7)"
          git push