spring:
  application:
    name: user-manager
  datasource:
    url: ${DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    show-sql: true
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    username: ${REDIS_USER}
    password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
    publisher-confirm-type: correlated

server:
  port: ${SERVICE_PORT:8080}
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, env
      base-path: /
  endpoint:
    health:
      show-details: when-authorized
  info:
    build:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n'

app:
  auth:
    secret: ${AUTH_SECRET}
    expiration-time: "PT10M"
  code-generation:
    subject: "Challenges Access Code"
    notification-message-template: "Your access code is: %s"
    key-prefix: "auth_code:"
    code-expiration-time: "PT10M"
  messaging:
    user:
      exchange: user-exchange
      user-created-routing-key: user.created
    auth:
      exchange: notifications-exchange
      auth-code-routing-key: notifications.auth
    dead-letter:
      exchange: dead-letter-exchange
      routing-key: dead-letter
      queue: dead-letter-queue