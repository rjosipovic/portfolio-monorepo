management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${TEMPO_HOST}:${TEMPO_PORT}/api/v2/spans
spring:
  cloud:
    consul:
      enabled: false # Disable Consul entirely
      discovery:
        enabled: false
    loadbalancer:
      enabled: false # Disable LoadBalancer so gateway routes use plain HTTP with k8s DNS directly